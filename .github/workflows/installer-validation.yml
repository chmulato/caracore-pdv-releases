name: PDV Portable ZIP Validation

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release (opcional). Em branco usa latest.'
        required: false
        type: string
      asset_name:
        description: 'Nome do ZIP portátil Windows (opcional; em branco detecta automaticamente).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-portable-zip:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_ASSET_NAME: ${{ inputs.asset_name }}
    steps:
      - name: Resolve release and download portable ZIP
        id: download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $repo = $env:REPO
          $assetName = $env:INPUT_ASSET_NAME

          if ([string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $releaseTag = if ($env:GITHUB_EVENT_NAME -eq 'release') { $env:GITHUB_REF_NAME } else { '' }
            if ([string]::IsNullOrWhiteSpace($releaseTag)) {
              $releaseApi = "https://api.github.com/repos/$repo/releases/latest"
              Write-Host "Using latest release from $repo"
            }
            else {
              $releaseApi = "https://api.github.com/repos/$repo/releases/tags/$releaseTag"
              Write-Host "Using triggering release tag $releaseTag"
            }
          }
          else {
            $releaseApi = "https://api.github.com/repos/$repo/releases/tags/$($env:INPUT_RELEASE_TAG)"
            Write-Host "Using release tag $($env:INPUT_RELEASE_TAG)"
          }

          $release = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get
          if (-not $release) { throw 'Release not found.' }

          $assets = @($release.assets)
          if ($assets.Count -eq 0) { throw "Release $($release.tag_name) has no assets." }

          $archiveAsset = $null
          if (-not [string]::IsNullOrWhiteSpace($assetName)) {
            $archiveAsset = $assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          }
          else {
            $archiveAsset = $assets | Where-Object { $_.name -match '(?i)windows-x64\.zip$' } | Select-Object -First 1
          }
          if (-not $archiveAsset) {
            $assetList = ($assets | ForEach-Object { $_.name }) -join ', '
            throw "No Windows x64 ZIP asset found in release. Assets: $assetList"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP $archiveAsset.name
          Write-Host "Downloading portable archive: $($archiveAsset.name)"
          Invoke-WebRequest -Uri $archiveAsset.browser_download_url -OutFile $archivePath

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($archive.Entries)
            $entryNames = @($entries | ForEach-Object { $_.Name })
            if (-not ($entryNames -contains 'iniciar_pdv.bat')) {
              throw 'Portable archive is missing iniciar_pdv.bat.'
            }
            if (-not ($entryNames -match '\.jar$')) {
              throw 'Portable archive is missing the application JAR.'
            }
          }
          finally {
            $archive.Dispose()
          }

          $sha = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Portable ZIP SHA256: $sha"

          $shaAsset = $assets | Where-Object { $_.name -match '(?i)SHA256SUMS' } | Select-Object -First 1
          if (-not $shaAsset) { throw 'Release is missing its SHA256SUMS sidecar.' }

          $shaPath = Join-Path $env:RUNNER_TEMP $shaAsset.name
          Invoke-WebRequest -Uri $shaAsset.browser_download_url -OutFile $shaPath
          $shaLine = Get-Content -Path $shaPath -Encoding UTF8 |
            Where-Object { $_ -match ('^\s*[0-9a-fA-F]{64}\s+\*?' + [regex]::Escape($archiveAsset.name) + '\s*$') } |
            Select-Object -First 1
          if (-not $shaLine) {
            throw "SHA256SUMS has no checksum for $($archiveAsset.name)."
          }
          $expected = (($shaLine -split '\s+')[0]).ToLowerInvariant()
          if ($expected -ne $sha) {
            throw "SHA256 mismatch. Expected: $expected, Actual: $sha"
          }
          Write-Host 'SHA256 validated against the release sidecar.'

          "release_tag=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_name=$($archiveAsset.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## PDV Portable ZIP Validation

          - Release: `${{ steps.download.outputs.release_tag }}`
          - Asset: `${{ steps.download.outputs.archive_name }}`
          - Status: ZIP structure and SHA-256 PASS
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
